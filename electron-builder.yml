appId: com.atlas.softwareauditor
productName: Atlas
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - core/**/*
  - shared/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  legalTrademarks: "Atlas - Explorador y Auditor Técnico"
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
